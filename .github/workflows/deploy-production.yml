name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: dualplate-production
  cancel-in-progress: false
jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chinese fonts for synthetic OCR tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: cd api && npm ci && npm test
      - run: cd admin && npm ci && npm run check && VITE_API_BASE_URL= npm run build
      - run: cd mobile && npm ci && VITE_API_BASE_URL= npm run build:h5
      - run: bash -n deploy/vm/*.sh
  deploy:
    needs: quality-gates
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify current main
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'Stale commit; stopping.' >&2; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      # 同 MasterDriver：在 GitHub 機器上建置並推送，部署帳戶只需 Artifact Registry 寫入權限
      - name: Build and push immutable images
        id: images
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPO: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          base="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in api web; do
            image="${base}/${name}:${tag}"
            docker buildx build --platform linux/amd64 --file "deploy/${name}/Dockerfile" --tag "$image" --push --provenance=false .
            digest="$(gcloud artifacts docker images describe "$image" --project="$PROJECT" --format='value(image_summary.digest)')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { printf 'Invalid digest for %s\n' "$image" >&2; exit 1; }
            printf '%s=%s@%s\n' "$name" "${base}/${name}" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Verify current main before VM mutation
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || { echo 'Stale commit; stopping.' >&2; exit 1; }
      # 2026-10-19 起正式環境在 HostKVM 共用伺服器；deploy-dualplate 帳號登入後只能執行 /srv/dualplate/deploy.sh
      - name: Release over SSH
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          SSH_KEY: ${{ secrets.HOSTKVM_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 45.134.82.239
          DEPLOY_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIfLOO+u+1eL4NfB87NjjvQm6GWt7b4ZKianVO7bGRGD
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy-dualplate@${DEPLOY_HOST}" "$API_IMAGE $WEB_IMAGE"
