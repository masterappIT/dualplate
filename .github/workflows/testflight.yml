name: TestFlight
# 推送到 main、正式部署成功後才發佈（App 連正式 API，要等 API 先上線）；只有 mobile/ 或 ios/ 改過才打包
# 不放進 deploy-production.yml：打包要約半小時，同一條隊列會擋住網頁部署
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dualplate-testflight
  cancel-in-progress: true
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      # 和上一個成功上傳的版本比（每次上傳後打 testflight/<編號> 標籤），一次推送多個提交也不會漏
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          last="$(git tag --list 'testflight/*' --sort=-version:refname | head -n1)"
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$last" ] || ! git diff --quiet "$last" "$SHA" -- mobile ios; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "$last 之後 mobile/、ios/ 沒有改動，不打包"
            echo build=false >> "$GITHUB_OUTPUT"
          fi
  upload:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PROFILE_NAME: dualplate-appstore-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd mobile && npm ci
      # SDK 不入庫；倉庫公開，所以加密後放在 Release（見 ios/README.md）
      - name: Restore DCloud SDK
        env:
          GH_TOKEN: ${{ github.token }}
          PASSPHRASE: ${{ secrets.IOS_SDK_PASSPHRASE }}
          SDK_SHA256: ${{ vars.IOS_SDK_ENC_SHA256 }}
        run: |
          set -euo pipefail
          gh release download ios-sdk-5.34 --pattern SDK.zip.enc --dir "$RUNNER_TEMP"
          echo "$SDK_SHA256  $RUNNER_TEMP/SDK.zip.enc" | shasum -a 256 -c -
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PASSPHRASE -in "$RUNNER_TEMP/SDK.zip.enc" -out "$RUNNER_TEMP/SDK.zip"
          unzip -q "$RUNNER_TEMP/SDK.zip" -d "$RUNNER_TEMP/sdk"
          mv "$RUNNER_TEMP/sdk/SDK" ios/dcloud-sdk-5.34
          rm -f "$RUNNER_TEMP/SDK.zip" "$RUNNER_TEMP/SDK.zip.enc"
      - name: Install signing
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          DCLOUD_APPKEY: ${{ secrets.DCLOUD_APPKEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE_BASE64" | base64 -d > "$profiles/$PROFILE_NAME.mobileprovision"
          printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "DCLOUD_APPKEY = $DCLOUD_APPKEY"
            echo 'CODE_SIGN_STYLE = Manual'
            echo 'CODE_SIGN_IDENTITY = Apple Distribution'
            echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
          } > ios/app/Config/Secrets.xcconfig
      - name: Archive and upload
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ios/testflight.sh
      - name: Mark the uploaded commit
        env:
          TAG: testflight/${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" ios/app/Config/Secrets.xcconfig
