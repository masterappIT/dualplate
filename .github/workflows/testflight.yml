name: TestFlight
# 推送到 main、正式部署成功後才發佈（App 連正式 API，要等 API 先上線）；只有 app/（Flutter 版）改過才打包
# 2026-11-23 起 iOS App 改用 Flutter（docs/tasks/flutter-app-plan.md 階段 5）；舊的 DCloud 版（mobile/、ios/）不再上傳
# 不放進 deploy-production.yml：打包要約半小時，同一條隊列會擋住網頁部署
on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dualplate-testflight
  cancel-in-progress: true
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      # 和上一個成功上傳的版本比（每次上傳後打 testflight/<編號> 標籤），一次推送多個提交也不會漏
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          last="$(git tag --list 'testflight/*' --sort=-version:refname | head -n1)"
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$last" ] || ! git diff --quiet "$last" "$SHA" -- app; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "$last 之後 app/ 沒有改動，不打包"
            echo build=false >> "$GITHUB_OUTPUT"
          fi
  upload:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # Xcode 27.2（iOS 27.2 SDK）只在 xcode-27 主機有；GitHub 標為預覽版
    runs-on: xcode-27
    timeout-minutes: 60
    environment: testflight
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PROFILE_NAME: dualplate-appstore-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      # Flutter 從官方倉庫取固定版本（和本機 flutter --version 一致），不用第三方 action
      - name: Install Flutter
        env:
          FLUTTER_VERSION: 3.47.4
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Install signing
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE_BASE64" | base64 -d > "$profiles/$PROFILE_NAME.mobileprovision"
          printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          # 只給 Runner 用（app/ios/Flutter/Release.xcconfig 以 #include? 引入），不影響套件的簽名
          {
            echo 'CODE_SIGN_STYLE = Manual'
            echo 'DEVELOPMENT_TEAM = YU6GT6HQJ8'
            echo 'CODE_SIGN_IDENTITY = Apple Distribution'
            echo 'CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution'
            echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
          } > app/ios/Flutter/Signing.xcconfig
      - name: Archive and upload
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" app/tool/testflight.sh
      - name: Mark the uploaded commit
        env:
          TAG: testflight/${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" app/ios/Flutter/Signing.xcconfig
