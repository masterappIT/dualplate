name: dualplate
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.13.3

dependencies:
  camera: ^0.12.2
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 底部分頁圖示，與 mobile/src/static/ 的同名檔案相同
  assets:
    - assets/tabbar/
    - assets/approval_card/
    # 啟動動畫的分層和第一幀的啟動圖（階段 4；產生方法見 tool/launch_png.sh）
    - assets/launch/
  # 批文卡宋體子集（只在 Android 用；Noto Serif SC，OFL；產生方法見 tool/song_subset.py）
  fonts:
    - family: DualplateSong
      fonts:
        - asset: assets/fonts/DualplateSong-Regular.otf
        - asset: assets/fonts/DualplateSong-Bold.otf
          weight: 700

# 相機套件 iOS 部分的修改版（階段 5b，管理者 2026-11-23 批准）：先用後鏡頭的組合鏡頭，近距離拍卡自動轉微距。
# 原版 camera_avfoundation 0.11.1，改動只在 CameraPlugin.swift 的 getAvailableCameras（註明「dualplate 修改」）。
# 升級 camera 套件時，要把這段改動搬到新版本。
dependency_overrides:
  camera_avfoundation:
    path: packages/camera_avfoundation
