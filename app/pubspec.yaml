name: dualplate
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 底部分頁圖示，與 mobile/src/static/ 的同名檔案相同
  assets:
    - assets/tabbar/
    - assets/approval_card/
  # 批文卡宋體子集（只在 Android 用；Noto Serif SC，OFL；產生方法見 tool/song_subset.py）
  fonts:
    - family: DualplateSong
      fonts:
        - asset: assets/fonts/DualplateSong-Regular.otf
        - asset: assets/fonts/DualplateSong-Bold.otf
          weight: 700
